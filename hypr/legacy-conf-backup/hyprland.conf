source = colors.conf

### MONITORS ###
monitor = eDP-1, 1920x1080@60, 0x0, 1

### MY PROGRAMS ###
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

### AUTOSTART ###
exec-once = nm-applet
exec-once = waybar
exec-once = swww-daemon
exec-once = blueman-applet
exec-once = swaync
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle

### ENVIRONMENT VARIABLES ###
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

### TAGS ###
source = ~/.config/hypr/configs/tags.conf

### LOOK AND FEEL ###
source = ~/.config/hypr/configs/looknfeel.conf

### ANIMATIONS ###
source = ~/.config/hypr/configs/UserAnimations.conf

### WINDOWRULES AND LAYERRULES ###
source = ~/.config/hypr/configs/windowrules.conf

### DWINDLE ###
dwindle {
    preserve_split = true
}

### MASTER ###
master {
    new_status = master
}

### MISC ###
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

### RENDER ###
render {
    new_render_scheduling = true
}

### INPUT ###
source = ~/.config/hypr/configs/input.conf

### KEYBINDS ###
source = ~/.config/hypr/configs/keybinds.conf

bind = CONTROL, P, exec, grim ~/Pictures/screenshot.png
bind = , PRINT, exec, hyprshot -m output --clipboard-only

#bind = CONTROL, P, exec, grim ~/Pictures/$(date +%Y%m%d_%H%M%S).png
