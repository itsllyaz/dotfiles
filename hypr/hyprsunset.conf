# hyprsunset profiles — automatic day/night blue-light filter.
# Manual toggle: SUPER + SHIFT + N (see scripts/nightlight.sh).

max-gamma = 150

# Daytime: no colour shift.
profile {
    time = 7:00
    identity = true
}

# Evening: warmer screen to reduce eye strain.
profile {
    time = 21:00
    temperature = 4000
    gamma = 1.0
}
